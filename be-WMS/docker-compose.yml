# =============================================================
# WMS Modular Monolith — Docker Compose
# =============================================================
# Variabel Kontrol Tesis:
#   - App service dibatasi 2 vCPU dan 2GB RAM
#   - Sesuai kondisi pengujian beban Bab III
# =============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"      # ← matikan debug agar tidak generate stack traces tiap request
      APP_KEY: base64:RpEzPp1B9yud2sE1FKSWJ0KL3B+8G8/pdRfZ6iWBrvs=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wms_db_test
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: K4Si9vNYmdFYtwfMrF7IR1yq9JxsrgcJXlresry5b2JdwJ4waHFZuDpwfdeUatOp
      JWT_ALGO: HS256
      SESSION_DRIVER: cookie   # ← tidak buat DB query, paling cepat
      CACHE_STORE: array       # ← in-memory, tidak ada overhead I/O
      QUEUE_CONNECTION: sync
    volumes:
      - .:/var/www
      - vendor_modulith:/var/www/vendor   # ← vendor di Docker volume, bukan Windows filesystem
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wms-network
    # ─── Resource Limits (Variabel Kontrol Tesis) ─────────────
    # Syntax yang benar untuk docker compose (bukan Swarm):
    #   cpus dan mem_limit di level service langsung
    deploy:
      resources:
        limits:
          cpus: '2.0'      # 2 vCPU
          memory: 2G       # 2 GB RAM
    # Untuk docker compose v2 style (lebih kompatibel):
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g

  mysql:
    image: mysql:8.0
    container_name: wms-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wms_db_test
      MYSQL_USER: wms_user
      MYSQL_PASSWORD: wms_password
    volumes:
      - wms_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wms-network

  prometheus:
    image: prom/prometheus:latest
    container_name: wms-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    networks:
      - wms-network

  grafana:
    image: grafana/grafana:latest
    container_name: wms-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - wms-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: wms-cadvisor
    privileged: true
    # Hapus atau ubah command docker_only jika tidak muncul data
    devices:
      - /dev/kmsg
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw # Penting untuk socket
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro # TAMBAHKAN INI: Wajib supaya bisa baca data container
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - wms-network

volumes:
  vendor_modulith:         # Named volume untuk folder vendor (mencegah I/O lambat dari Windows)
    driver: local
  wms_mysql_data:
    driver: local

networks:
  wms-network:
    driver: bridge
